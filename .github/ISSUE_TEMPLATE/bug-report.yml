name: Bug report
description: Report a problem with this firmware for the TP-Link Archer A5 v4 / Archer C50 v4
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What goes wrong and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: |
        LuCI shows it under *Status → Overview → Firmware Version* (`a5v4-r1`), or run `cat /etc/a5v4_release`. For a firmware built by yourself, give the commit from that file.
      placeholder: a5v4-r1
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Archer A5 v4 (v4.2, v4.20)
        - Archer C50 v4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How this release was installed
      options:
        - Update page in LuCI
        - Flash firmware page or sysupgrade, settings kept
        - Fresh install or settings not kept
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: The system log (`logread`) and the settings you changed from the defaults.
